name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  cosmocc_version: '4.0.2'
  # bump to discard every cached sysroot
  sysroot_key_prefix: sysroot-v1

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    outputs:
      guests: ${{ steps.plan.outputs.guests }}
      sysroot_key: ${{ steps.plan.outputs.sysroot_key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The guests come from scripts/lib/guests.sh. The sysroot key covers the files deps_key
      # (scripts/lib/deps.sh) hashes; if the two disagree, BUILD_STAGE=qemu stops the build.
      - name: Read the guests and the sysroot key
        id: plan
        run: |
          . scripts/lib/guests.sh
          guests="$(printf '%s\n' ${SUPPORTED_GUESTS} | jq -R . | jq -sc .)"
          echo "guests=${guests}" >> "$GITHUB_OUTPUT"
          echo "sysroot_key=${{ env.sysroot_key_prefix }}-${{ env.cosmocc_version }}-${{ hashFiles('scripts/build.sh', 'scripts/lib/common.sh', 'scripts/lib/deps.sh', 'scripts/lib/headers.sh', 'scripts/lib/toolchain.sh', 'patches/glib/**', 'patches/libslirp/**', 'patches/libseccomp/**', 'compat/**') }}" >> "$GITHUB_OUTPUT"
          echo "Guests: ${guests}"

  # The sysroots (glib, gnutls, ...) do not depend on the guest: build each host architecture's
  # once, cached under a key of the files that make it. They hold absolute paths (pkg-config), so
  # every job builds in the same checkout directory.
  deps:
    name: Build the ${{ matrix.arch }} sysroot
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64, aarch64 ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Restore the sysroot
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/${{ matrix.arch }}/sysroot
          key: ${{ needs.plan.outputs.sysroot_key }}-${{ matrix.arch }}

      - name: Set up the build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-build
        with:
          cosmocc-version: ${{ env.cosmocc_version }}

      - name: Build the sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        run: BUILD_STAGE=deps ARCHES=${{ matrix.arch }} ./scripts/build.sh

      - name: Save the sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/${{ matrix.arch }}/sysroot
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-sysroot-${{ matrix.arch }}
          path: build/logs/
          if-no-files-found: ignore

  build:
    name: Build qemu-system-${{ matrix.guest }}
    needs: [ plan, deps ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        guest: ${{ fromJSON(needs.plan.outputs.guests) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cosmocc-version: ${{ env.cosmocc_version }}

      - name: Restore the x86_64 sysroot
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/x86_64/sysroot
          key: ${{ needs.plan.outputs.sysroot_key }}-x86_64
          fail-on-cache-miss: true

      - name: Restore the aarch64 sysroot
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build/aarch64/sysroot
          key: ${{ needs.plan.outputs.sysroot_key }}-aarch64
          fail-on-cache-miss: true

      # qemu-img is built every time; the x86_64 job's copy is the one published
      - name: Build
        run: BUILD_STAGE=qemu SYSTEM_TARGETS=${{ matrix.guest }} ./scripts/build.sh

      - name: Upload qemu-system-${{ matrix.guest }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-system-${{ matrix.guest }}
          path: out/qemu-system-${{ matrix.guest }}.com
          if-no-files-found: error

      - name: Upload qemu-img
        if: matrix.guest == 'x86_64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-img
          path: out/qemu-img.com
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs-${{ matrix.guest }}
          path: build/logs/
          if-no-files-found: ignore

  # One job per runner and guest, so adding a guest adds jobs rather than stretching their timeouts.
  # The guest-independent stages (qemu-img, -sandbox, SDL) run with the x86_64 guest.
  smoke:
    name: Smoke tests (${{ matrix.runner.name }}, ${{ matrix.guest }})
    needs: [ plan, build ]
    runs-on: ${{ matrix.runner.os }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        guest: ${{ fromJSON(needs.plan.outputs.guests) }}
        runner:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Linux aarch64
            os: ubuntu-24.04-arm
          - name: Windows x86_64
            os: windows-latest
          - name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install SDL2 and Xvfb
        if: runner.os == 'Linux' && matrix.guest == 'x86_64'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 xvfb xdotool

      - name: Download the executables
        run: |
          mkdir dist
          for n in qemu-img qemu-system-${{ matrix.guest }}; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$n" --dir dist
          done
          ls -l dist

      # One step per stage, each with its own timeout: a hang in one does not hide the rest
      - name: Test qemu-img
        if: matrix.guest == 'x86_64'
        timeout-minutes: 10
        run: ./scripts/smoke_test_all.sh dist img

      - name: Test -sandbox
        if: ${{ !cancelled() && matrix.guest == 'x86_64' }}
        timeout-minutes: 10
        run: ./scripts/smoke_test_all.sh dist sandbox

      - name: Test the system emulator
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: ./scripts/smoke_test_all.sh dist system

      - name: Test the system emulator with -sandbox
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: ./scripts/smoke_test_all.sh dist system-sandbox

      - name: Test -display sdl
        if: ${{ !cancelled() && matrix.guest == 'x86_64' }}
        timeout-minutes: 10
        run: ./scripts/smoke_test_all.sh dist sdl

  release:
    name: Publish release
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    # one release at a time so concurrent pushes can't compute the same tag
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      # Tag is <upstream QEMU version>.<n>, e.g. v9.2.0.0. If a tag for this
      # version already points at HEAD, reuse it; otherwise bump n.
      - name: Compute version tag
        id: version
        run: |
          upstream="$(sed -n 's/^QEMU_VERSION="\${QEMU_VERSION:-\(v[0-9][0-9.]*\)}"$/\1/p' scripts/build.sh)"
          [ -n "$upstream" ] || { echo "could not parse QEMU_VERSION from scripts/build.sh" >&2; exit 1; }

          existing="$(git tag --points-at "$GITHUB_SHA" --list "${upstream}.*" | grep -E "^${upstream//./\\.}\.[0-9]+$" | sort -V | tail -n1 || true)"
          if [ -n "$existing" ]; then
            tag="$existing"
          else
            last="$(git tag --list "${upstream}.*" | grep -E "^${upstream//./\\.}\.[0-9]+$" | sed "s/^${upstream//./\\.}\.//" | sort -n | tail -n1 || true)"
            tag="${upstream}.$(( ${last:--1} + 1 ))"
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Download build artifacts
        run: |
          mkdir dist
          . scripts/lib/guests.sh
          for n in qemu-img $(for g in $SUPPORTED_GUESTS; do echo "qemu-system-$g"; done); do
            gh run download "$GITHUB_RUN_ID" --name "$n" --dir dist
          done
          ls -l dist

      - name: Create or update release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "QEMU ${UPSTREAM} built with Cosmopolitan Libc from ${GITHUB_SHA}."
          fi
          gh release upload "$TAG" dist/*.com --clobber
