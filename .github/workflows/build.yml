name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  cosmocc_version: '4.0.2'

jobs:
  build:
    name: Build qemu-img and the system emulators
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup cosmocc
        uses: bjia56/setup-cosmocc@c0097c34319baeca1b41cc857ec5c643f2f5baf6
        with:
          version: ${{ env.cosmocc_version }}

      # linux-libc-dev(-arm64-cross): kernel headers for QEMU's KVM code
      # mingw-w64-common: Windows Hypervisor Platform headers for QEMU's WHPX code
      # qemu-user-static: runs the aarch64 halves for configure probes and tests
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config zip bzip2 patch \
            qemu-user-static linux-libc-dev linux-libc-dev-arm64-cross \
            mingw-w64-common
          pip install meson

      - name: Build
        run: ./scripts/build.sh

      - name: Test the aarch64 halves
        run: ./scripts/smoke_test_aarch64.sh out

      - name: Upload qemu-img
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qemu-img
          path: |
            out/qemu-img.com
            out/COPYING
            out/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

      - name: Upload qemu-system-x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qemu-system-x86_64
          path: |
            out/qemu-system-x86_64.com
            out/COPYING
            out/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

      - name: Upload qemu-system-aarch64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qemu-system-aarch64
          path: |
            out/qemu-system-aarch64.com
            out/COPYING
            out/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore
