name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  cosmocc_version: '4.0.2'

jobs:
  build:
    name: Build qemu-img and the system emulators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup cosmocc
        uses: bjia56/setup-cosmocc@c0097c34319baeca1b41cc857ec5c643f2f5baf6 # v0.0.6
        with:
          version: ${{ env.cosmocc_version }}

      # linux-libc-dev(-arm64-cross): kernel headers for QEMU's KVM code
      # qemu-user-static: runs the aarch64 halves for configure probes and tests
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake p7zip-full pkg-config zip bzip2 patch autoconf automake libtool libltdl-dev gperf \
            qemu-user-static linux-libc-dev linux-libc-dev-arm64-cross
          pipx install meson

      # The smoke tests run in the smoke job, on every OS, from the uploaded executables
      - name: Build
        run: ./scripts/build.sh
        env:
          SMOKE_TESTS: '0'

      - name: Upload qemu-img
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-img
          path: out/qemu-img.com
          if-no-files-found: error

      - name: Upload qemu-system-x86_64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-system-x86_64
          path: out/qemu-system-x86_64.com
          if-no-files-found: error

      - name: Upload qemu-system-aarch64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-system-aarch64
          path: out/qemu-system-aarch64.com
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore

  smoke:
    name: Smoke tests (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.os }}
    # Windows and macOS have not been run in CI before: they report failures without blocking the release
    continue-on-error: ${{ matrix.experimental }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            experimental: false
          # runs the aarch64 halves natively
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            experimental: false
          - name: Windows x86_64
            os: windows-latest
            experimental: true
          - name: macOS arm64
            os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the executables
        run: |
          mkdir dist
          for n in qemu-img qemu-system-x86_64 qemu-system-aarch64; do
            gh run download "$GITHUB_RUN_ID" --name "$n" --dir dist
          done
          ls -l dist

      - name: Test
        run: ./scripts/smoke_test_all.sh dist

  release:
    name: Publish release
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}

    # one release at a time so concurrent pushes can't compute the same tag
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      # Tag is <upstream QEMU version>.<n>, e.g. v9.2.0.0. If a tag for this
      # version already points at HEAD, reuse it; otherwise bump n.
      - name: Compute version tag
        id: version
        run: |
          upstream="$(sed -n 's/^QEMU_VERSION="\${QEMU_VERSION:-\(v[0-9][0-9.]*\)}"$/\1/p' scripts/build.sh)"
          [ -n "$upstream" ] || { echo "could not parse QEMU_VERSION from scripts/build.sh" >&2; exit 1; }

          existing="$(git tag --points-at "$GITHUB_SHA" --list "${upstream}.*" | grep -E "^${upstream//./\\.}\.[0-9]+$" | sort -V | tail -n1 || true)"
          if [ -n "$existing" ]; then
            tag="$existing"
          else
            last="$(git tag --list "${upstream}.*" | grep -E "^${upstream//./\\.}\.[0-9]+$" | sed "s/^${upstream//./\\.}\.//" | sort -n | tail -n1 || true)"
            tag="${upstream}.$(( ${last:--1} + 1 ))"
          fi
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Download build artifacts
        run: |
          mkdir dist
          for n in qemu-img qemu-system-x86_64 qemu-system-aarch64; do
            gh run download "$GITHUB_RUN_ID" --name "$n" --dir dist
          done
          ls -l dist

      - name: Create or update release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "QEMU ${UPSTREAM} built with Cosmopolitan Libc from ${GITHUB_SHA}."
          fi
          gh release upload "$TAG" dist/*.com --clobber
