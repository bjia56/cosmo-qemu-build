name: Set up the build
description: cosmocc and the packages scripts/build.sh needs (see "Building from source" in the README)
inputs:
  cosmocc-version:
    description: cosmocc release
    required: true
runs:
  using: composite
  steps:
    - name: Setup cosmocc
      uses: bjia56/setup-cosmocc@c0097c34319baeca1b41cc857ec5c643f2f5baf6 # v0.0.6
      with:
        version: ${{ inputs.cosmocc-version }}

    # linux-libc-dev(-arm64-cross): kernel headers for QEMU's KVM code
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake p7zip-full pkg-config zip bzip2 patch autoconf automake libtool libltdl-dev gperf \
          qemu-user-static linux-libc-dev linux-libc-dev-arm64-cross
        pipx install meson
